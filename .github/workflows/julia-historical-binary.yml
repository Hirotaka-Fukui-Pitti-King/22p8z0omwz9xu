name: Historical 2013 binary protocol versus published 2015 benchmark
on:
  push:
    branches:
      - research/issue5-historical-binary-protocol
    paths:
      - 'Nirei-2015/scripts/historical_binary_protocol.jl'
      - '.github/workflows/julia-historical-binary.yml'
  workflow_dispatch:

jobs:
  binary-replication:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: Nirei-2015
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12.6'
      - name: Parse Julia source and scripts
        run: julia --project=. scripts/check_julia_syntax.jl
      - name: Resolve and import package
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); using Nirei2015'
      - name: Small N binary one-sided smoke (3 periods)
        run: julia --project=. scripts/historical_binary_protocol.jl 3 48 20261101
      - name: Historical binary under published 2015 calibration, N=110000 T20
        timeout-minutes: 45
        run: julia --project=. scripts/historical_binary_protocol.jl 20 110000 20261101
      - name: Strict T20 completion and fixed-point residual gate
        run: |
          julia --project=. -e 'using TOML; d=TOML.parsefile("results/historical_binary_T20_N110000_seed20261101_hybrid.toml"); @assert d["completed"] && d["completed_periods"]==20; @assert d["max_abs_CES_residual"]<1e-8 && d["max_abs_investment_residual"]<1e-8'
      - name: Historical binary under published 2015 calibration, N=110000 T1100
        timeout-minutes: 110
        run: julia --project=. scripts/historical_binary_protocol.jl 1100 110000 20261101
      - name: Strict T1100 completion and fixed-point residual gate
        run: |
          julia --project=. -e 'using TOML; d=TOML.parsefile("results/historical_binary_T1100_N110000_seed20261101_hybrid.toml"); @assert d["completed"] && d["completed_periods"]==1100; @assert d["max_abs_CES_residual"]<1e-8 && d["max_abs_investment_residual"]<1e-8'
      - name: Original 2013 model calibration, N=350000 T20
        timeout-minutes: 60
        run: julia --project=. scripts/historical_binary_protocol.jl 20 350000 20261101 2013
      - name: Strict 2013 T20 completion
        run: |
          julia --project=. -e 'using TOML; d=TOML.parsefile("results/historical_binary_T20_N350000_seed20261101_2013.toml"); @assert d["completed"] && d["completed_periods"]==20; @assert d["max_abs_CES_residual"]<1e-8 && d["max_abs_investment_residual"]<1e-8'
      - name: Original 2013 model calibration, N=350000 T1100
        timeout-minutes: 110
        run: julia --project=. scripts/historical_binary_protocol.jl 1100 350000 20261101 2013
      - name: Strict 2013 T1100 completion
        run: |
          julia --project=. -e 'using TOML; d=TOML.parsefile("results/historical_binary_T1100_N350000_seed20261101_2013.toml"); @assert d["completed"] && d["completed_periods"]==1100; @assert d["max_abs_CES_residual"]<1e-8 && d["max_abs_investment_residual"]<1e-8'
      - name: Save all historical binary results (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-binary-source-grounded-experiment
          if-no-files-found: warn
          path: |
            Nirei-2015/results/historical_binary_*.csv
            Nirei-2015/results/historical_binary_*.toml
