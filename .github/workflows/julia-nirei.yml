name: Julia syntax and package smoke checks

on:
  push:
    paths:
      - 'Nirei-2015/**'
      - '.github/workflows/julia-nirei.yml'
  pull_request:
    paths:
      - 'Nirei-2015/**'
      - '.github/workflows/julia-nirei.yml'
  workflow_dispatch:

jobs:
  julia-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Nirei-2015
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12.6'
      - name: Parse every Julia source and script
        run: julia --project=. scripts/check_julia_syntax.jl
      - name: Resolve installed dependencies
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Precompile and load package
        run: julia --project=. -e 'using Pkg; Pkg.precompile(); using Nirei2015'
      - name: Calibration and RE smoke run
        run: |
          julia --project=. scripts/run_calibration.jl
          julia --project=. scripts/run_expectations.jl
      - name: Independent small-N fixed-point oracle
        run: julia --project=. scripts/check_equilibrium_oracle.jl
      - name: Stage 12 independent small-N multi-step oracle and J=1 regression
        timeout-minutes: 15
        run: julia --project=. scripts/diagnostic_multistep_equilibrium.jl small
      - name: Stage 13 small-N dynamic J2 smoke
        timeout-minutes: 15
        run: julia --project=. scripts/diagnostic_multistep_simulation.jl smoke
      - name: Stage 13 dynamic A/B 20-period benchmark N (no shock rejection)
        timeout-minutes: 45
        run: julia --project=. scripts/diagnostic_multistep_simulation.jl run 20 110000 20261101
      - name: Stage 12 original t5 full multi-step equilibrium sweep J=1..4
        timeout-minutes: 60
        run: julia --project=. scripts/diagnostic_multistep_equilibrium.jl benchmark 110000 20261101
      - name: Stage 10 original t5 fixed-point and feasibility diagnostic (benchmark N)
        timeout-minutes: 30
        run: julia --project=. scripts/diagnostic_equilibrium_feasibility.jl 110000 20261101 32
      - name: Initial collapse attribution (benchmark N)
        run: julia --project=. scripts/audit_investment_dynamics.jl
      - name: Diagnostic shock-rejection 20-period smoke (benchmark N)
        run: julia --project=. scripts/diagnostic_shock_rejection.jl 20 110000 20261101 100
      - name: Diagnostic shock-rejection full 1100-period trial (benchmark N)
        timeout-minutes: 90
        run: julia --project=. scripts/diagnostic_shock_rejection.jl 1100 110000 20261101 100
      - name: Exact CES capital and rational expectations closure audit (benchmark N)
        timeout-minutes: 90
        run: julia --project=. scripts/diagnostic_capital_closure.jl 1100 110000 20261101 100
      - name: Stage 8 conditional investment wedge (benchmark N, five states)
        timeout-minutes: 90
        run: julia --project=. scripts/diagnostic_investment_wedge.jl 501 110000 20261101 32 100
      - name: Firm simulation integration smoke (benchmark N, 20 periods)
        run: |
          julia --project=. scripts/run_benchmark.jl 20 110000 20261101
          julia --project=. -e 'using TOML; x = TOML.parsefile("results/simulation_summary.toml"); @assert x["status"]["completed"] && x["status"]["completed_periods"] == 20'
      - name: Archive shock-rejection diagnostic files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nirei-issue5-shock-rejection
          if-no-files-found: warn
          path: |
            Nirei-2015/results/diagnostic_shock_rejection_counterfactual_*.csv
            Nirei-2015/results/diagnostic_shock_rejection_counterfactual_*.toml
            Nirei-2015/results/diagnostic_capital_closure_*.csv
            Nirei-2015/results/diagnostic_capital_closure_*.toml
            Nirei-2015/results/diagnostic_investment_wedge_*.csv
            Nirei-2015/results/diagnostic_investment_wedge_*.toml
            Nirei-2015/results/diagnostic_equilibrium_feasibility_*.csv
            Nirei-2015/results/diagnostic_equilibrium_feasibility_*.toml
            Nirei-2015/results/diagnostic_multistep_equilibrium_*.csv
            Nirei-2015/results/diagnostic_multistep_equilibrium_*.toml
            Nirei-2015/results/diagnostic_multistep_simulation_*.csv
            Nirei-2015/results/diagnostic_multistep_simulation_*.toml
