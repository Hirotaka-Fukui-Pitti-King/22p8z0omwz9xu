name: One-time Nirei archive research branch cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nirei-archive-branch-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete-fully-merged-research-branches:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen heads are present in the archival main history, then delete
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 6d3fbf445d9a1d8d40e485778a42d2062c0385d2 HEAD
          cat > /tmp/nirei-archived-branches.txt <<'ARCHIVED'
research/issue5-author-epsilon-protocol 8a7f9d63ed7f42cca65a0430759c5d431c2c27ac
research/issue5-historical-binary-protocol d8bfcff155dea362080d8395ec6bb64e05b78f14
research/issue5-original-seed-sensitivity f8a6b879bdf16c168ff429eac863300fa4f35e7d
research/issue5-original-sigma-correction 9cf5701b739ce50e3abcd87015059d329b121261
research/issue5-stage8-investment-wedge ee444c13a525ba3699480698471cb31b0d1b7318
research/issue5-stage10-fixed-point-feasibility 3ee1956ac9b436cbaa15c84a74d1c8d7ff1166f8
research/issue5-stage11-global-equilibrium-domain cc870db10187a3d02378c645a9a15f4573812353
research/issue5-stage12-multistep-equilibrium d351c52342c95704cd79afea3d8dbb0208a352c2
research/issue5-stage13-dynamic-multistep eb76c3449e6aa308ad9829dc2a37b9a6e0e77510
research/issue5-stage17-dynamic-re-equilibrium 6174d1f83f45fd556df09321c00f3e8bb3c425c7
research/issue5-stage18-original-implementation-repair a5f159ca1b16545a1b2a31e3d3540bc9fc56ae15
ARCHIVED
          echo 'Preflight: verify every remote work branch SHA and merged ancestry.'
          while read -r branch expected_sha; do
            current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq '.object.sha')"
            test "${current_sha}" = "${expected_sha}" || {
              echo "REF CHANGED; refusing deletion: ${branch} expected ${expected_sha} got ${current_sha}" >&2
              exit 1
            }
            git merge-base --is-ancestor "${expected_sha}" HEAD || {
              echo "UNMERGED; refusing deletion: ${branch}" >&2
              exit 1
            }
            echo "MERGED AND UNCHANGED: ${branch} ${expected_sha}"
          done < /tmp/nirei-archived-branches.txt
          echo 'All eleven work branch heads are merged and unchanged. Deleting refs.'
          while read -r branch expected_sha; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" >/dev/null
            echo "DELETED: ${branch}"
          done < /tmp/nirei-archived-branches.txt
          echo 'DONE: 11 branches deleted; commits remain in main ancestry.'
