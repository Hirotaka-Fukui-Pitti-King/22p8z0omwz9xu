name: FMR 2020 source algorithm audit
on:
  push:
    branches:
      - research/fmr-2020-stage3-sudden-stop-exchange-regimes
    paths:
      - 'FMR-2020/src/**'
      - 'FMR-2020/matlab/**'
      - 'FMR-2020/scripts/compare_matlab_egm_fixture.jl'
      - 'FMR-2020/scripts/export_calibrated_terminal_fixture.jl'
      - 'FMR-2020/scripts/export_stage3_fx_fixture.jl'
      - 'FMR-2020/test/**'
      - 'FMR-2020/scripts/check_syntax.jl'
      - 'FMR-2020/scripts/validate_sudden_stop.jl'
      - '.github/workflows/fmr-stage3-source-audit.yml'
  pull_request:
    paths:
      - 'FMR-2020/src/**'
      - 'FMR-2020/matlab/**'
      - 'FMR-2020/scripts/compare_matlab_egm_fixture.jl'
      - 'FMR-2020/scripts/export_calibrated_terminal_fixture.jl'
      - 'FMR-2020/scripts/export_stage3_fx_fixture.jl'
      - 'FMR-2020/test/**'
      - '.github/workflows/fmr-stage3-source-audit.yml'
  workflow_dispatch:

jobs:
  julia-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: FMR-2020
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12.6'
      - name: Instantiate Julia environment
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Parse all Julia files and load FMR2020
        run: julia --project=. scripts/check_syntax.jl
      - name: Unit tests, source full-grid EGM regression and docstrings
        run: julia --project=. test/runtests.jl
      - name: Independent Stage 3 shock and price-block smoke
        run: julia --project=. scripts/validate_sudden_stop.jl

  matlab-octave-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: julia-replication
      - uses: actions/checkout@v4
        with:
          repository: kurtmitman/HANKSOME
          path: HANKSOME
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12.6'
      - name: Install GNU Octave to evaluate original MATLAB routines
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends octave
      - name: Export actual calibrated 161-node Julia terminal and 193-node source inputs
        working-directory: julia-replication/FMR-2020
        run: |
          julia --project=. -e 'using Pkg; Pkg.instantiate()'
          julia --project=. scripts/export_calibrated_terminal_fixture.jl results/matlab_egm_fixture/calibrated_input
      - name: Evaluate original-source Rouwenhorst and source PCHIP one-step EGM
        run: |
          octave --no-gui --quiet --eval "addpath('julia-replication/FMR-2020/matlab'); export_source_egm_fixture('HANKSOME','julia-replication/FMR-2020/results/matlab_egm_fixture');"
      - name: Reevaluate original source solve_R at actual calibrated Julia prices
        run: |
          octave --no-gui --quiet --eval "addpath('julia-replication/FMR-2020/matlab'); export_calibrated_terminal_fixture('HANKSOME','julia-replication/FMR-2020/results/matlab_egm_fixture/calibrated_input','julia-replication/FMR-2020/results/matlab_egm_fixture/calibrated_output');"
      - name: Export real shock-date foreign-debt portfolios and both trade-price roots
        working-directory: julia-replication/FMR-2020
        run: |
          julia --project=. scripts/export_stage3_fx_fixture.jl results/matlab_egm_fixture/fx_input
      - name: Revalue original shock-date household portfolios with original MATLAB basefun
        run: |
          octave --no-gui --quiet --eval "addpath('julia-replication/FMR-2020/matlab'); export_stage3_fx_fixture('HANKSOME','julia-replication/FMR-2020/results/matlab_egm_fixture/fx_input','julia-replication/FMR-2020/results/matlab_egm_fixture/fx_output');"
      - name: Compare source MATLAB fixture and Julia full-grid EGM numerically
        working-directory: julia-replication/FMR-2020
        run: |
          julia --project=. -e 'using Pkg; Pkg.instantiate()'
          julia --project=. scripts/compare_matlab_egm_fixture.jl results/matlab_egm_fixture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fmr-matlab-octave-full-grid-egm-fixture
          if-no-files-found: ignore
          path: julia-replication/FMR-2020/results/matlab_egm_fixture/
