name: Source-grounded author epsilon and continuum Eq18 numerical protocol
on:
  push:
    branches:
      - research/issue5-author-epsilon-protocol
    paths:
      - 'Nirei-2015/scripts/historical_epsilon_closure.jl'
      - '.github/workflows/julia-author-epsilon.yml'
  workflow_dispatch:

jobs:
  approximate-author-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: Nirei-2015
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12.6'
      - name: Parse all Julia source and scripts
        run: julia --project=. scripts/check_julia_syntax.jl
      - name: Install packages and load Nirei2015
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); using Nirei2015'
      - name: Check published Table 1 sigma and small-N oracle
        run: |
          julia --project=. scripts/check_published_table1.jl
          julia --project=. scripts/check_equilibrium_oracle.jl
      - name: Approximate continuum epsilon approach small N T3
        run: julia --project=. scripts/historical_epsilon_closure.jl 3 48 20261101
      - name: Approximate continuum epsilon at published N T20
        timeout-minutes: 30
        run: julia --project=. scripts/historical_epsilon_closure.jl 20 110000 20261101
      - name: Strict T20 completion and direct-X reaggregation gate
        run: |
          julia --project=. -e 'using TOML; d=TOML.parsefile("results/historical_epsilon_T20_N110000_seed20261101.toml"); @assert d["completed"] && d["completed_periods"]==20; @assert d["max_abs_X_reaggregation_residual"]<1e-8'
      - name: Approximate continuum epsilon at published N T1100
        timeout-minutes: 85
        run: julia --project=. scripts/historical_epsilon_closure.jl 1100 110000 20261101
      - name: Strict T1100 completion and direct-X reaggregation gate
        run: |
          julia --project=. -e 'using TOML; d=TOML.parsefile("results/historical_epsilon_T1100_N110000_seed20261101.toml"); @assert d["completed"] && d["completed_periods"]==1100; @assert d["max_abs_X_reaggregation_residual"]<1e-8'
      - name: Preserve both successful and partial-failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-epsilon-approximation
          if-no-files-found: warn
          path: |
            Nirei-2015/results/historical_epsilon_*.csv
            Nirei-2015/results/historical_epsilon_*.toml
